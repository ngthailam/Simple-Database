<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Menlo, monospace">
  <style>
    .label { font-size: 12.5px; fill: #333; }
    .title { font-size: 14px; font-weight: bold; fill: #111; }
    .field { font-size: 11.5px; fill: #222; }
    .comment { font-size: 10.5px; fill: #888; font-style: italic; }
    .child-line { stroke: #2b6cb0; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    .next-line { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 6,4; fill: none; marker-end: url(#arrow-red); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#fafafa"/>

  <text x="20" y="26" class="title">3-level B+Tree: root (internal) -&gt; internal nodes -&gt; leaves</text>
  <rect x="20" y="36" width="14" height="14" fill="#fce8e6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="47" class="label">Root (internal, level 1)</text>
  <rect x="220" y="36" width="14" height="14" fill="#fdf6e3" stroke="#b7950b" stroke-width="1.5"/>
  <text x="240" y="47" class="label">Internal node (level 2)</text>
  <rect x="440" y="36" width="14" height="14" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="460" y="47" class="label">Leaf node (level 3, data)</text>
  <line x1="640" y1="43" x2="675" y2="43" class="child-line"/>
  <text x="682" y="47" class="label">children pointer (down)</text>
  <line x1="900" y1="43" x2="935" y2="43" class="next-line"/>
  <text x="942" y="47" class="label">next_leaf pointer (sideways)</text>

  <!-- LEVEL 1: ROOT -->
  <g>
    <rect x="580" y="70" width="240" height="80" rx="8" fill="#fce8e6" stroke="#c0392b" stroke-width="2.5"/>
    <text x="595" y="92" class="title">ROOT (internal)</text>
    <text x="595" y="110" class="field">is_leaf = False</text>
    <text x="595" y="126" class="field">keys     = [50]</text>
    <text x="595" y="142" class="field">children = [P, Q]</text>
  </g>

  <!-- LEVEL 2: two internal nodes P and Q -->
  <g>
    <rect x="180" y="240" width="260" height="80" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="2"/>
    <text x="195" y="262" class="title">P (internal)</text>
    <text x="195" y="280" class="field">is_leaf = False</text>
    <text x="195" y="296" class="field">keys     = [20]</text>
    <text x="195" y="312" class="field">children = [A, B]</text>
  </g>

  <g>
    <rect x="960" y="240" width="260" height="80" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="2"/>
    <text x="975" y="262" class="title">Q (internal)</text>
    <text x="975" y="280" class="field">is_leaf = False</text>
    <text x="975" y="296" class="field">keys     = [80]</text>
    <text x="975" y="312" class="field">children = [C, D]</text>
  </g>

  <!-- LEVEL 3: four leaves A B C D -->
  <g>
    <rect x="20" y="420" width="260" height="140" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="35" y="442" class="title">LEAF A</text>
    <text x="35" y="462" class="field">is_leaf   = True</text>
    <text x="35" y="480" class="field">keys      = [5, 10]</text>
    <text x="35" y="498" class="field">values    = ["row-5","row-10"]</text>
    <text x="35" y="516" class="field">next_leaf = Leaf B</text>
    <text x="35" y="534" class="comment">keys &lt; 20</text>
  </g>

  <g>
    <rect x="340" y="420" width="260" height="140" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="355" y="442" class="title">LEAF B</text>
    <text x="355" y="462" class="field">is_leaf   = True</text>
    <text x="355" y="480" class="field">keys      = [20, 30, 40]</text>
    <text x="355" y="498" class="field">values    = ["row-20","row-30","row-40"]</text>
    <text x="355" y="516" class="field">next_leaf = Leaf C</text>
    <text x="355" y="534" class="comment">20 &lt;= keys &lt; 50</text>
  </g>

  <g>
    <rect x="740" y="420" width="260" height="140" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="755" y="442" class="title">LEAF C</text>
    <text x="755" y="462" class="field">is_leaf   = True</text>
    <text x="755" y="480" class="field">keys      = [50, 60, 70]</text>
    <text x="755" y="498" class="field">values    = ["row-50","row-60","row-70"]</text>
    <text x="755" y="516" class="field">next_leaf = Leaf D</text>
    <text x="755" y="534" class="comment">50 &lt;= keys &lt; 80</text>
  </g>

  <g>
    <rect x="1080" y="420" width="260" height="140" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="1095" y="442" class="title">LEAF D</text>
    <text x="1095" y="462" class="field">is_leaf   = True</text>
    <text x="1095" y="480" class="field">keys      = [80, 90]</text>
    <text x="1095" y="498" class="field">values    = ["row-80","row-90"]</text>
    <text x="1095" y="516" class="field">next_leaf = None</text>
    <text x="1095" y="534" class="comment">keys &gt;= 80</text>
  </g>

  <!-- children: root -> P, Q -->
  <path d="M 620,150 C 500,190 400,210 320,240" class="child-line"/>
  <text x="380" y="205" class="label" fill="#2b6cb0">children[0]</text>
  <path d="M 780,150 C 900,190 1000,210 1080,240" class="child-line"/>
  <text x="960" y="205" class="label" fill="#2b6cb0">children[1]</text>

  <!-- children: P -> A, B -->
  <path d="M 260,320 C 220,360 190,390 165,420" class="child-line"/>
  <text x="175" y="370" class="label" fill="#2b6cb0">children[0]</text>
  <path d="M 360,320 C 420,360 450,390 470,420" class="child-line"/>
  <text x="400" y="370" class="label" fill="#2b6cb0">children[1]</text>

  <!-- children: Q -> C, D -->
  <path d="M 1040,320 C 960,360 920,390 890,420" class="child-line"/>
  <text x="900" y="370" class="label" fill="#2b6cb0">children[0]</text>
  <path d="M 1140,320 C 1180,360 1200,390 1210,420" class="child-line"/>
  <text x="1150" y="370" class="label" fill="#2b6cb0">children[1]</text>

  <!-- next_leaf: A->B->C->D -->
  <path d="M 280,485 L 340,485" class="next-line"/>
  <path d="M 600,485 L 740,485" class="next-line"/>
  <path d="M 1000,485 L 1080,485" class="next-line"/>

  <!-- search callout -->
  <rect x="20" y="600" width="1360" height="100" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="35" y="622" class="field" fill="#111">search(60): root sees 60 &gt;= 50 -&gt; children[1] = Q  |  Q sees 60 &lt; 80 -&gt; children[0] = Leaf C  |  Leaf C scans keys, finds 60 -&gt; "row-60"</text>
  <text x="35" y="644" class="field" fill="#111">3 page reads total: ROOT -&gt; Q -&gt; LEAF C. This is the whole point: log(n) reads instead of scanning every leaf.</text>
  <text x="35" y="670" class="field" fill="#111">range_scan(25, 65): descend once to LEAF B (holds 25) -&gt; walk next_leaf: B -&gt; C, collecting keys in [25,65] -&gt; stop, never revisits ROOT/P/Q again</text>
</svg>
